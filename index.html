function MetricCard({ label, value, unit, sub, icon }) {

      e('div', null,

        ),
        sub ? e('p', { className: 'text-xs text-slate-400 mt-1' }, sub) : null
      ),
      icon ? e('span', { className: 'text-3xl opacity-60' }, icon) : null
    )
  );
}

function SectionTitle({ id, title, subtitle }) {

  return e('section', { className: 'fade-in' },

function CompetitionTable() {

      e('tbody', null,

      e('p', { className: 'text-brand-100 leading-relaxed' }, 'Nenhum player domina o segmento prefeituras/municipal com: plataforma acessível (R$100-500/mês), DPO terceirizado incluído, adequação à Lei 14.133/2021 (dispensa de licitação), data center no Brasil, e foco em serviços municipais específicos.'),

function PrefeituraChart() {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    const ctx = canvasRef.current.getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Com LGPD (28%)', 'Sem LGPD (72%)'],
        datasets: [{ data: [1559, 4011], backgroundColor: ['#3b82f6', '#e2e8f0'], borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' } } } },
        cutout: '65%'
      }
    });
  }, []);
  return e('canvas', { ref: canvasRef, style: { maxHeight: '280px' } });
}

    { name: 'Municipal Full', price: 'R$ 997', period: '/mês', features: ['Tudo do Plus', 'Consultoria presencial', 'Roadmap ISO 27001', 'API integração', 'Suporte prioritário'], highlight: false }

  const empresaPlans = [
    { name: 'Starter', price: 'R$ 149', period: '/mês', features: ['Diagnóstico automatizado', 'Documentos básicos', 'Inventário de dados', 'Treinamentos', 'Self-service'], highlight: false },

function App() {
  const [section, setSection] = useState('mercado');
  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) setSection(entry.target.id); });
    }, { threshold: 0.3 });
    ['mercado', 'concorrencia', 'prefeituras', 'pricing', 'roadmap'].forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return e('div', { className: 'min-h-screen' },
    e(NavBar, { activeSection: section }),
    // HERO
    e('div', { className: 'hero-gradient text-white pt-24 pb-16 px-4' },
      e('div', { className: 'max-w-5xl mx-auto text-center' },
        e('h1', { className: 'text-4xl md:text-6xl font-black mb-4 leading-tight' }, 'O "Contabilizei" da ', e('span', { className: 'text-brand-300' }, 'LGPD')),
        e('p', { className: 'text-xl text-blue-200 mb-8 max-w-2xl mx-auto' }, 'Plataforma SaaS de conformidade LGPD e processamento de dados para prefeituras e empresas brasileiras'),
        e('div', { className: 'flex flex-wrap justify-center gap-4' },
          e('a', { href: '#mercado', className: 'bg-white text-brand-800 px-6 py-3 rounded-lg font-semibold hover:bg-blue-50 transition-colors' }, 'Ver Pesquisa de Mercado'),
          e('a', { href: '#roadmap', className: 'border border-white/30 text-white px-6 py-3 rounded-lg font-semibold hover:bg-white/10 transition-colors' }, 'Roadmap MVP → Escala')
        ),
        e('div', { className: 'mt-10 grid grid-cols-3 gap-4 max-w-lg mx-auto' },
          ...[
            { v: '5.570', l: 'Municípios' },
            { v: '72%', l: 'Sem LGPD' },
            { v: 'R$60Mi', l: 'TAM' }
          ].map((s, i) =>
            e('div', { key: i, className: 'text-center' },
              e('p', { className: 'text-2xl md:text-3xl font-bold' }, s.v),
              e('p', { className: 'text-xs text-blue-300' }, s.l)
            )
          )
        )
      )
    ),
    // SECTIONS
    e('div', { className: 'max-w-7xl mx-auto px-4 py-12 space-y-16' },
      e(MarketSection),
      e(CompetitionSection),
      e(PrefeituraSection),
      e(PricingSection),
      e(ISOSection),
      e(RoadmapSection),
      // SOURCES
      e('footer', { className: 'pt-8 border-t border-slate-200' },
        e('h3', { className: 'font-semibold text-slate-700 mb-4' }, 'Fontes Validadas'),
        e('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 text-xs text-slate-500' },
          ...[
            'IBGE — Perfil dos Municípios 2024', 'MarketsandMarkets — Cybersecurity BR', 'IMARC Group — Legaltech LatAm',
            'Grand View Research — Legal Services BR', 'Ken Research — RegTech BR', 'ANPD — Fiscalização ativa 2025',
            'Lei 14.133/2021 — Dispensa de licitação', 'Confidata, DPO MAX, LGPD Express — Preços reais',
            'Contabilizei — Modelo de negócio referência', 'ISO 27001/27701 — TopCertifier Brasil'
          ].map((s, i) =>
            e('div', { key: i, className: 'flex items-center gap-1' }, e('span', { className: 'text-green-500' }, '✓'), s)
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
