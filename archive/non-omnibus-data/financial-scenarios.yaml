# ============================================================================
# SENSITIVITY ANALYSIS (Tornado Diagram Variables)
# ============================================================================
sensitivity_analysis:
  methodology: "One-variable-at-a-time sensitivity on MRR Month 30"

  variables:
    - variable: "LOI Count"
      base_value: 3
      range: [0, 10]
      impact: "CRITICAL"
      sensitivity_score: 0.95
      mrr_variance_pct: 80
      description: "Directly affects go/no-go and investor confidence"

    - variable: "Churn Rate"
      base_value: 2.5  # %
      range: [1.0, 5.0]
      impact: "HIGH"
      sensitivity_score: 0.85
      mrr_variance_pct: 45
      description: "Affects LTV and payback period"

    - variable: "CAC"
      base_value: 1800  # BRL
      range: [800, 3500]
      impact: "HIGH"
      sensitivity_score: 0.80
      mrr_variance_pct: 35
      description: "Affects payback and cash requirements"

    - variable: "ARPU"
      base_value: 397  # BRL
      range: [297, 1497]
      impact: "MEDIUM"
      sensitivity_score: 0.70
      mrr_variance_pct: 30
      description: "Affects revenue and gross margin"

    - variable: "Advisor Status"
      base_value: 1  # Month 4
      range: [0, 2]
      impact: "CRITICAL"
      sensitivity_score: 0.90
      sales_cycle_variance: "6-18 months"
      description: "Affects sales cycle duration"

    - variable: "Funding"
      base_value: 960000  # BRL
      range: [500000, 2000000]
      impact: "HIGH"
      sensitivity_score: 0.75
      runway_variance: "14-48 months"
      description: "Affects time to market"

# ============================================================================
# MONTE CARLO SIMULATION (10,000 iterations)
# ============================================================================
monte_carlo:
  methodology: "Probabilistic scenario modeling"
  iterations: 10000
  confidence_level: 95

  inputs:
    - parameter: "Monthly Growth Rate"
      distribution: "normal"
      mean: 0.05
      std_dev: 0.02
    - parameter: "Churn Rate"
      distribution: "beta"
      alpha: 5
      beta: 50
    - parameter: "CAC"
      distribution: "lognormal"
      mean: 1800
      std_dev: 600
    - parameter: "ARPU"
      distribution: "uniform"
      min: 297
      max: 1497

  outputs:
    - metric: "MRR at Month 30"
      percentile_5: 85000
      percentile_25: 180000
      percentile_50: 280000
      percentile_75: 420000
      percentile_95: 750000

    - metric: "Break-even Month"
      percentile_5: null  # 30% never break even
      percentile_25: null
      percentile_50: 30
      percentile_75: 24
      percentile_95: 18

    - metric: "Probability of Positive Outcome"
      definition: "MRR > R$200K at Month 30"
      probability: 0.65

    - metric: "Probability of Shutdown"
      definition: "Runway < 6 months before break-even"
      probability: 0.22

