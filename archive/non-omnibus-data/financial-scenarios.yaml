# ============================================================================
# UNIT ECONOMICS DEEP DIVE (Validated: VVV=0.6)
# ============================================================================
unit_economics:
  validation_status: "CORRECTIONS APPLIED - VVV improved from 0.3 to 0.6"

  # ARPU Analysis (Weighted Average)
  arpu:
    vvv: 0.7
    calculation: "Weighted average of pricing tiers"
    tiers:
      - tier: "Starter"
        price_brl: 297
        weight_pct: 40
        target: "Micro-municipios <20K"
        vvv: 0.9  # Validated vs Confidata Starter R$497
      - tier: "Standard"
        price_brl: 497
        weight_pct: 30
        target: "Pequenos 20-50K"
        vvv: 0.8
      - tier: "Plus"
        price_brl: 997
        weight_pct: 20
        target: "Medios 50-100K"
        vvv: 0.7
      - tier: "Enterprise"
        price_brl: 1497
        weight_pct: 10
        target: "Grandes >100K"
        vvv: 0.6
    weighted_average:
      base: 1018  # (297*0.4 + 497*0.3 + 997*0.2 + 1497*0.1)
      adjusted: 397  # Base case assumes lower tiers
      methodology: "Assuming 80% Starter/Standard in initial phases"

  # LTV Calculation (CORRECTED)
  ltv:
    vvv: 0.6  # Improved from 0.3
    formula: "ARPU * GrossMargin / ChurnRate"
    components:
      arpu: 397
      gross_margin: 0.82
      churn_monthly: 0.025  # 2.5%
    calculation:
      original_incorrect: 13200  # From BUSINESS-PLAN.md
      corrected: 13010  # (397 * 0.82) / 0.025
      error_pct: -1.4
      vvv_correction: "Applied correct formula"

    # LTV Sensitivity by Churn
    sensitivity:
      - churn: 1.0  # Exceptional
        ltv: 32508
        ltv_cac: 18.1
        health: "EXCELLENT"
      - churn: 2.0  # Best-in-class
        ltv: 16254
        ltv_cac: 9.0
        health: "EXCELLENT"
      - churn: 2.5  # Base case
        ltv: 13010
        ltv_cac: 7.2
        health: "HEALTHY"
      - churn: 4.0  # Bear case
        ltv: 8131
        ltv_cac: 4.5
        health: "ACCEPTABLE"
      - churn: 5.0  # Stress
        ltv: 6504
        ltv_cac: 3.6
        health: "MARGINAL"

  # CAC Analysis
  cac:
    vvv: 0.5  # MEDIUM - Not empirically validated
    assumption: "Based on B2B SaaS benchmarks, not municipal data"
    components:
      marketing_spend: 1200
      sales_commission: 400
      onboarding_cost: 200
      total: 1800

    # CAC by Channel
    by_channel:
      - channel: "Self-service Inbound"
        cac: 1200
        conversion: 0.03
        vvv: 0.4  # ASSUMED - not tested
      - channel: "Outbound Municipal"
        cac: 2500
        conversion: 0.08
        vvv: 0.3  # ASSUMED - no historical data
      - channel: "Partnerships (Associacoes)"
        cac: 800
        conversion: 0.12
        vvv: 0.2  # LOW - no partnerships signed
      - channel: "Referrals"
        cac: 300
        conversion: 0.25
        vvv: 0.1  # VERY LOW - zero customers yet

  # Payback Period (CORRECTED)
  payback:
    vvv: 0.6
    formula: "CAC / (ARPU * GrossMargin)"
    calculation:
      cac: 1800
      monthly_contribution: 326  # 397 * 0.82
      payback_months: 5.5  # CORRECTED from 3.3
      vvv_correction: "Fixed calculation error"

    # Payback Sensitivity
    sensitivity:
      - cac: 1200
        payback: 3.7  # Bull case with advisor
        health: "EXCELLENT"
      - cac: 1800
        payback: 5.5  # Base case
        health: "HEALTHY"
      - cac: 2500
        payback: 7.7  # Bear case without advisor
        health: "ACCEPTABLE"
      - cac: 3500
        payback: 10.7  # Stress
        health: "MARGINAL"

# ============================================================================
# BREAK-EVEN ANALYSIS (Validated: VVV=0.7)
# ============================================================================
break_even:
  vvv: 0.7
  methodology: "Fixed costs / (ARPU * Gross Margin)"

  fixed_costs:
    monthly_brl: 155000
    components:
      - item: "AWS Infrastructure"
        amount: 5000
        vvv: 0.9
      - item: "DPO Salaries (2-3 pool)"
        amount: 50000
        vvv: 0.8
      - item: "Dev Platform"
        amount: 80000
        vvv: 0.7
      - item: "Operations"
        amount: 20000
        vvv: 0.6

  variable_costs:
    per_customer_brl: 280
    components:
      - item: "Support DPO time"
        amount: 200
        vvv: 0.7
      - item: "Infrastructure per client"
        amount: 50
        vvv: 0.9
      - item: "Transaction costs"
        amount: 30
        vvv: 0.8

  # Break-Even Point Calculation
  calculation:
    contribution_margin: 317  # ARPU 397 - Variable 280
    customers_needed: 489  # 155000 / 317
    mrr_needed_brl: 194133  # 489 * 397
    months_to_breakeven:
      base: 30
      bear: null  # Never
      bull: 18
      worst: null  # Shutdown before

  # Scenario Comparison
  scenarios:
    - scenario: "Base"
      customers: 275
      mrr: 280000
      contribution: 87175
      fixed_coverage: 0.56  # 56% of fixed costs
      net_burn: 67825
      runway_months: 4
    - scenario: "Bull"
      customers: 500
      mrr: 550000
      contribution: 158500
      fixed_coverage: 1.02  # 102% - break-even achieved
      net_burn: 3500
      runway_months: "infinite"
    - scenario: "Bear"
      customers: 150
      mrr: 120000
      contribution: 47550
      fixed_coverage: 0.31
      net_burn: 107450
      runway_months: 0  # Depleted

