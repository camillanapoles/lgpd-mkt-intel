# ============================================================================
# APPENDIX: VVV SCORING METHODOLOGY
# ============================================================================
vvv_methodology:
  definition: "Verificacao (source verification) + Verdade (data accuracy) + Valida (business logic)"

  scoring:
    - range: [0.9, 1.0]
      label: "VERIFIED"
      description: "Multiple primary sources, cross-validated"
    - range: [0.7, 0.9]
      label: "HIGH CONFIDENCE"
      description: "Primary source + reasonable assumptions"
    - range: [0.5, 0.7]
      label: "MEDIUM CONFIDENCE"
      description: "Secondary sources or unverified assumptions"
    - range: [0.3, 0.5]
      label: "LOW CONFIDENCE"
      description: "Assumptions or estimates without validation"
    - range: [0.0, 0.3]
      label: "UNVERIFIED"
      description: "Placeholder or guesswork - CRITICAL GAP"

