# Metadados de Análise
metadados:
  data_analise: "2026-05-08"
  analisador: "agent-SWOT-specialist"
  versao: "1.0"
  vvv_medio:
    forcas: 0.845
    fracas: 0.825
    oportunidades: 0.895
    ameacas: 0.775
  recomendacao_principal: "PRIORITIZAR validacao viabilidade economica (custo dev X pricing X margem) E status OSCIP antes de qualquer desenvolvimento. Sem isso, risco de execution é alto mesmo com mercado favoravel."

# Matriz de Prioridade de Ação (baseada em VVV x Impacto)
acoes_imediatas:
  - ordem: 1
    acao: "Camila: entregar orçamento de desenvolvimento com 80% de confidence"
    vvv: 0.95
    impacto: "CRITICO - sem isso, impossivel precificar ou levantar funding"
    fonte: "W1"

  - ordem: 2
    acao: "Gislene: validar qualificação OSCIP do instituto (se existe ou é plano)"
    vvv: 0.85
    impacto: "CRITICO - sem OSCIP ativa, edge competitivo desaparece"
    fonte: "W7"

  - ordem: 3
    acao: "Wilton: levantar 3 quotes de fornecedores de digitalização (spread real)"
    vvv: 0.8
    impacto: "ALTO - margem depende disso"
    fonte: "W6"

  - ordem: 4
    acao: "Todos: definir product spec MVP (features must-have vs. phase 2)"
    vvv: 0.85
    impacto: "ALTO - escopo aberto vira scope creep"
    fonte: "W4"

  - ordem: 5
    acao: "Simone: levantar histórico de conversão (propostas X fechamentos, ticket médio)"
    vvv: 0.8
    impacto: "ALTO - permite estimar runway e sizing time vendas"
    fonte: "analise-riscos-neogov.md L60"

# Trigger de Go/No-Go
condicao_green_light:
  regra: "(custo dev <= R$150k) E (pricing >= R$5k/mês) E (OSCIP ativa)"
  resultado_se_true: "Green light - iniciar desenvolvimento MVP 45 dias"
  resultado_se_false: "Pivot ou rethink model - continuar VALIDANDO até atingir condições"
  vvv_condicao: 0.9
