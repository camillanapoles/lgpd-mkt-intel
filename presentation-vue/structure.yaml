# Vue 3 + Vite Strategic Presentation - GitHub Pages
# Apresentação Interativa para Planejamento Estratégico

project:
  name: "lgpd-strategic-presentation"
  version: "1.0.0"
  description: "Apresentação interativa para alinhamento estratégico com análise de cenários, SWOT, BMC e roadmap"

# Stack Tecnológico
stack:
  framework: "Vue 3"
  build_tool: "Vite 5.x"
  language: "TypeScript"
  styling: "Tailwind CSS"
  deployment: "GitHub Pages"
  state_management: "Pinia"
  routing: "Vue Router"
  charts: "Chart.js + vue-chartjs"
  animations: "Vue Transition + GSAP"

# Estrutura de Pastas
structure:
  root: "/src"
  dirs:
    - components:
        description: "Componentes reutilizáveis"
        subdirs:
          - strategic:
              - "SwotAnalysis.vue"
              - "BusinessModelCanvas.vue"
              - "RoadmapViewer.vue"
              - "ScenarioSimulator.vue"
              - "Dashboard5s.vue"
          - layout:
              - "PresentationNav.vue"
              - "SlideContainer.vue"
              - "ProgressBar.vue"
          - interactive:
              - "DecisionMatrix.vue"
              - "StakeholderMap.vue"
              - "TimelineSlider.vue"
              - "ComparisonTable.vue"

    - views:
        description: "Views principais da apresentação"
        files:
          - "HomeView.vue"
          - "SwotView.vue"
          - "BmcView.vue"
          - "RoadmapView.vue"
          - "ScenariosView.vue"
          - "DashboardView.vue"
          - "ConclusionView.vue"

    - stores:
        description: "Pinia stores para estado global"
        files:
          - "strategic.ts"
          - "presentation.ts"
          - "scenarios.ts"
          - "metrics.ts"

    - types:
        description: "Definições TypeScript"
        files:
          - "strategic.types.ts"
          - "presentation.types.ts"
          - "scenarios.types.ts"

    - data:
        description: "Fonte única de verdade JSON"
        files:
          - "strategic-data.json"
          - "swot-analysis.json"
          - "business-model-canvas.json"
          - "roadmap.json"
          - "scenarios.json"
          - "stakeholders.json"

    - composables:
        description: "Vue composables"
        files:
          - "usePresentation.ts"
          - "useScenarioSimulation.ts"
          - "useStrategicMetrics.ts"
          - "useDataValidation.ts"

    - assets:
        description: "Recursos estáticos"
        subdirs:
          - "images/"
          - "icons/"
          - "styles/"

    - public:
        description: "Arquivos públicos"
        files:
          - "favicon.ico"
          - "robots.txt"

# package.json
package_json:
  name: "lgpd-strategic-presentation"
  version: "1.0.0"
  type: "module"
  scripts:
    dev: "vite"
    build: "vue-tsc && vite build"
    preview: "vite preview"
    deploy: "npm run build && gh-pages -d dist"
  dependencies:
    vue: "^3.4.0"
    vue-router: "^4.2.5"
    pinia: "^2.1.7"
    chart.js: "^4.4.0"
    vue-chartjs: "^5.3.0"
    gsap: "^3.12.5"
  devDependencies:
    vite: "^5.0.0"
    vue-tsc: "^1.8.27"
    typescript: "^5.3.3"
    tailwindcss: "^3.4.0"
    autoprefixer: "^10.4.16"
    postcss: "^8.4.32"
    gh-pages: "^6.1.1"

# Configuração Vite para GitHub Pages
vite_config:
  base: "/lgpd-strategic-presentation/"
  build:
    outDir: "dist"
    assetsDir: "assets"
  server:
    port: 4173
    open: true

# Estrutura JSON Fonte Única
data_structure:
  strategic_data:
    meta:
      version: "1.0.0"
      last_updated: "2026-05-08"
      source: "transcricao_analysis"
    sections:
      - swot:
          strengths: []
          weaknesses: []
          opportunities: []
          threats: []
      - bmc:
          key_partners: []
          key_activities: []
          key_resources: []
          value_propositions: []
          customer_relationships: []
          channels: []
          customer_segments: []
          cost_structure: []
          revenue_streams: []
      - roadmap:
          phases: []
          milestones: []
          dependencies: []
      - scenarios:
          baseline: {}
          optimistic: {}
          pessimistic: {}
      - stakeholders:
          internal: []
          external: []

# Componentes Interativos
interactive_features:
  scenario_simulation:
    description: "Simulação interativa de cenários"
    features:
      - slider_alteracao_variaveis
      - impacto_tempo_real
      - comparacao_cenario_vs_baseline
      - export_decisao

  decision_support:
    description: "Suporte à decisão em reunião"
    features:
      - matriz_decisao_interativa
      - votacao_tempo_real
      - ranking_prioridades
      - minutes_export

  dashboard_5s:
    description: "Dashboard estratégico 5 segundos"
    features:
      - kpis_principais
      - alertas_criticos
      - status_execucao
      - next_actions

# Fluxo de Apresentação
presentation_flow:
  slides:
    - id: "01"
      title: "Visão Geral"
      component: "HomeView"
      duration: 60
    - id: "02"
      title: "Análise SWOT"
      component: "SwotView"
      duration: 300
      interactive: true
    - id: "03"
      title: "Business Model Canvas"
      component: "BmcView"
      duration: 300
      interactive: true
    - id: "04"
      title: "Roadmap Estratégico"
      component: "RoadmapView"
      duration: 240
      interactive: true
    - id: "05"
      title: "Simulação de Cenários"
      component: "ScenariosView"
      duration: 420
      interactive: true
    - id: "06"
      title: "Dashboard 5s"
      component: "DashboardView"
      duration: 60
    - id: "07"
      title: "Conclusões e Próximos Passos"
      component: "ConclusionView"
      duration: 120

# Metodologia de Validação
validation_methodology:
  vvv_system:
    description: "Sistema de Verificação, Validação e Veracidade"
    levels:
      - verified: "Verificado por agente especialista"
      - validated: "Validado contra metodologia estratégica"
      - sources: "Fontes mapeadas e rastreáveis"

  quality_gates:
    - gate_1: "Dados da transcrição extraídos e validados"
    - gate_2: "Insights mapeados a fontes"
    - gate_3: "SWOT com justificativa de mercado"
    - gate_4: "BMC alinhado ao plano estratégico"
    - gate_5: "Roadmap com dependências mapeadas"
    - gate_6: "Cenários com análise de impacto"
    - gate_7: "Apresentação validada por UX/Review"

# Deploy Configuration
github_pages:
  repository: "repository-url"
  branch: "gh-pages"
  base_url: "/lgpd-strategic-presentation/"
  build_command: "npm run build"
  deploy_command: "npm run deploy"

# Acessibilidade
accessibility:
  wcag_level: "AA"
  features:
    - keyboard_navigation
    - screen_reader_support
    - high_contrast_mode
    - font_scaling
    - color_blind_friendly

# Performance
performance_targets:
  lighthouse_score: 90+
  first_contentful_paint: "< 1.5s"
  largest_contentful_paint: "< 2.5s"
  cumulative_layout_shift: "< 0.1"
